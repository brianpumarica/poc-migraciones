services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: poc_db
    ports:
      - "5432:5432"

  web:
    build: .
    restart: always
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:password@db:5432/poc_db
    depends_on:
      - db
    # Al momento de hacer el deploy (up), actualiza, autogenera si hay cambios, aplica y levanta la app
    command: sh -c "alembic upgrade head && alembic revision --autogenerate -m 'auto-deploy' && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  watcher:
    build: .
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://admin:password@db:5432/poc_db
    depends_on:
      - db
    command: python -u auto_migrator.py
